<!-- ============================================================================
  WORDRANK — daily word-frequency ranking game (formerly "Parlance")
  ============================================================================
  CONTEXT FOR FUTURE DEVELOPMENT (human or AI): read this block first.
  This single file IS the entire product. No build step, no backend, no deps
  beyond the React/Babel CDN scripts below. Deployed on GitHub Pages.

  ── THE GAME ────────────────────────────────────────────────────────────────
  One puzzle per day. Player is shown 5 words in a scrambled order and must
  rank them from MOST to LEAST commonly used in everyday English, in at most
  4 guesses. After each guess, each card is colored by positional distance
  from its true rank:
      GREEN  = exactly right spot (locks)
      YELLOW = wrong spot (any distance, one away or more)
      WHITE  = neutral/untouched — this word hasn't been judged in this rank
               yet (never guessed there, or moved since its last verdict)
  Win = all green. Share artifact is a Wordle-style emoji grid (one row per
  guess): e.g.  "WordRank #14 — 3/4" + rows of squares emoji + URL.
  The theme of each word set exists in data but is NOT shown (blind guess 1).

  ── DESIGN HISTORY / WHY IT IS THE WAY IT IS (hard-won, don't regress) ──────
  * v1: 4 words, 3-color distance feedback, word sets with huge frequency
    gaps (MONEY..TROMBONE). Playtest verdict: TOO EASY — solvable on guess 1
    by intuition alone; feedback never mattered.
  * v2: binary feedback (green/wrong) + hard word sets. Verdict: TOO GUESSY —
    binary feedback = Mastermind; nothing to deduce between guesses.
  * v3: hard word sets (all mid-frequency band, Zipf ~2.4–4.7, adjacent gaps
    ~0.25–0.5) × 3-color DISTANCE feedback (green/gold/red) × a guess RECORD
    that shows the actual word arrangement per guess (not anonymous squares)
    so players can reason across guesses. 5 words (120 orderings), 4 guesses.
    The intended arc: guess 1 = semantic intuition, guesses 2–3 = constraint
    deduction. THE DIFFICULTY LIVES IN THE DATA: closer Zipf values = harder.
  * v4 (WordRank rebrand): collapsed distance feedback from 3 colors to 2 —
    GREEN (exact) vs YELLOW (wrong, any distance). Red is gone; a near-miss
    and a total miss now read the same, which pushes players toward the
    guess RECORD (the actual arrangements) rather than trying to read
    fine-grained distance signal from color alone. The neutral/untouched
    tile color (off-white card stock) is now explicitly named WHITE in the
    key so players understand it as a real state ("not judged in this rank")
    rather than a rendering default.
  * v5: moved onboarding off the always-visible footer text and into a
    one-screen HowToPlay primer shown full-bleed on first visit (gated by
    wordrank.seenIntro in localStorage). It covers goal, the drag/tap-to-
    swap interaction, and the color key together, once, instead of asking
    new players to absorb permanent footer text mid-board. A small "ⓘ"
    button pinned top-right reopens the same primer any time — it does NOT
    reset seenIntro; it's just a manual re-trigger, so this is not "did
    they finish onboarding" state, only "have they seen it once unprompted."
  * v6 (CURRENT, mobile pass): real playtest on a 3-year-old iPhone found
    two problems. (1) The color key lived in the footer, below the board —
    on a short phone it scrolled out of view during actual play, exactly
    when it's needed. Moved to a compact one-line version ABOVE the board,
    under the header; the footer keeps only the placeholder-data disclaimer.
    (2) The 5-tile board + submit button — the actual game — must fit
    above the fold with NO scrolling on a small phone; everything else
    (dev panel, record, disclaimer) may scroll. Got there by compacting
    header padding/font, tile padding, row gaps, and button margins — verify
    with a real viewport (iPhone SE 375×667 is the tightest common target)
    before changing these numbers again, not by eyeballing a desktop window.
    (3) The endgame reveal (share + stats + frequency receipts) was inline
    content stacked below the board, so on a short phone it read as "stuck
    at the bottom" and the SHARE button — the thing players actually want —
    was the *last* thing, after the frequency reveal. It's now a full-screen
    ResultsOverlay (same modal pattern as HowToPlay) ordered headline → SHARE
    → stats → frequency reveal (the receipts are a bonus, not the goal).
    "← BACK TO PUZZLE" hides the overlay so players can see their finished
    (locked-green) board; a floating "VIEW RESULTS" pill reopens it — same
    reopen pattern as the "ⓘ" button, so the app now has exactly one idiom
    for "temporarily-dismissed overlay you can bring back."
  * v7: added GA4 analytics (see the ANALYTICS section below for the full
    event list).
  * v8 (CURRENT, prime-time cleanup): shipped for real, so the dev panel
    (tap "No. X" → prev/next/reset/theme-toggle to roam the whole PUZZLES
    list) is GONE — it was a playtesting tool, and leaving a hidden menu
    reachable by tapping the puzzle number is exactly the kind of thing a
    real player finds by accident and reports as a bug. Removing it made
    `isToday`/`puzzleIdx`-switching/`resetFor` dead weight too (there is no
    way to ever be on a puzzle other than today's anymore), so those got
    deleted rather than kept around unreachable — includes simplifying the
    v7 analytics gating (it used to guard against dev-panel test puzzles;
    now every play is a real one, so the guards are just gone, not
    dead-code `if (true)`s). Also added a "PROBLEMS OR FEEDBACK?" link in
    the footer (Google Form) with its own `feedback_link_clicked` event —
    see FEEDBACK_URL in CONFIG to change the destination.
  * v9 (CURRENT): expanded PUZZLES from 12 to 30 (indices 0-29) and ran
    EVERY set — the original 12 included — through the wordfreq pipeline;
    none are hand-estimated placeholders anymore (several of the original
    12 had the WRONG order once checked against real data — e.g. "Around
    the sink" was shipped as SOAP>LEMON>SPIDER>LADDER>FAUCET; the real
    order is SPIDER>SOAP>LEMON>LADDER>FAUCET). At 30 puzzles and one/day
    from EPOCH, puzzle #30 lands on 2026-08-13; puzzle #31 (2026-08-14)
    wraps back to index 0 ("Outdoors") since dayNum % PUZZLES.length only
    has 30 slots — add more sets before then or the list starts repeating.
    Curation caught three words that look fine but fail the "avoid
    ambiguous homographs" rule HARD because the alternate sense is both
    unrelated AND at least as common as the intended one: PHOENIX (mythic
    bird vs. the US city — dropped from "Myth and monsters"), FAMILIAR
    (witch's companion vs. the far more common adjective — dropped from
    "Wizardry"), RAPTOR (dinosaur vs. the ordinary word for any bird of
    prey — dropped from "Dinosaurs"), and STAR as a night-sky anchor (its
    celebrity sense likely dominates frequency more than the astronomical
    one — "Night sky" now anchors on MOON instead). Ordinary polysemy
    (SOAP/soap opera, GHOST/ghosting, THOR-the-myth/THOR-the-movie) was
    left alone — the bar is "different enough sense that a player would
    feel cheated," not "has any other meaning at all."
  * v10 (CURRENT, launch-readiness pass from external playtest feedback):
    - SHARE_URL was a bare "domain/path" string — some share targets won't
      auto-link text without a scheme. Now a full "https://…/" URL, and
      the share text got a one-line tagline (SHARE_TAGLINE) between the
      score header and the emoji grid so a share reads standalone, out of
      context, without the reader having ever seen the game.
    - Added full Open Graph + Twitter Card tags (og:image at og-image.png,
      1200×630, generated to match the in-game palette/typography — see
      that file's own generation script if you need to regenerate it;
      og:url, twitter:card=summary_large_image) — previously a shared link
      had no preview image at all, which reads as low-effort on Reddit/
      Discord/Slack.
    - Removed maximum-scale=1.0 / user-scalable=no from the viewport meta.
      Disabling pinch-zoom is an accessibility anti-pattern on modern
      sites and wasn't load-bearing for anything the game does.
    - Added a one-line "about" under the header (visible immediately, no
      HowToPlay tap required) — external feedback specifically flagged
      that a cold visitor from a social link should get what/how/how-long
      without opening Help. HowToPlay's subtitle got the same "~1 minute"
      framing for consistency.
  * Feedback color persistence rule: a card wears its verdict color ONLY
    while it remains in the position it was judged in; moving it reverts it
    to neutral (verdicts are about positions, not words). Self-teaching.
  * v3.1 (playtest, day 1): rules were a one-time intro line that vanished
    on first interaction — a real player forgot gold-vs-red mid-game and
    resubmitted their guess-1 arrangement as guess 4 (X/4). Rules + color
    key are now ALWAYS visible, pinned below the board. Don't hide them.
    Also added: submit blocks ANY previously tried arrangement.
  * v3.2 (playtest, day 1): green cards now LOCK ("✓") — they can't
    be selected, dragged, or displaced when other cards move past them
    (drag skips over pinned rows; only unlocked cards reflow). Rationale:
    a tester moved a green card, watched it lose green, and concluded the
    game was broken. If green states a fact ("this position is correct"),
    the board must enforce it; letting confirmed-correct cards be displaced
    as a side effect of insertion punished correct reasoning. Note this is
    NOT the rejected "confidence lock" player mechanic from early design —
    it's the game keeping its own feedback promises. Also renamed the
    selected-card hint "SWAP…" -> "TAP ANOTHER" (read as a button, not an
    instruction).
  * Interaction: pointer-based drag to reorder (mobile friendly,
    touch-action:none) AND tap-two-to-swap (a press moving <6px = tap).
  * Onboarding chrome: full instructions (goal + interaction + color key)
    live ONLY in the HowToPlay primer (first-visit modal + reopenable via
    the "ⓘ" button). Colors are worn on the tiles themselves after that;
    the permanent footer key is a reminder, not a tutorial.
  * Wordle-isms kept deliberately: daily cadence, guess-rows share grid,
    solved-in-N as the score, streaks/stats in localStorage.

  ── DATA MODEL / THE CORPUS PLAN ────────────────────────────────────────────
  Each puzzle = { theme, words: [{ w, zipf }] } listed MOST→LEAST common,
  i.e. array index === true rank (0 = most common). All game logic derives
  from that invariant. `zipf` = log10(frequency per billion words); the
  reveal screen shows 10^(zipf-3) as "uses per million words".
  All 30 shipped sets are VERIFIED against real data (v9) — none are
  hand-estimated placeholders. The pipeline for generating/checking more:
  an offline Python script using the `wordfreq` package (blend of
  subtitles/wiki/books/web corpora; chosen because multi-source blending
  best matches general intuition and settles arguments):

      # pip install wordfreq
      from wordfreq import zipf_frequency
      words = ["thunder", "penguin", "canoe", "hammock", "toboggan"]
      for w in sorted(words, key=lambda w: -zipf_frequency(w, "en")):
          print(w.upper(), round(zipf_frequency(w, "en"), 2))

  Puzzle-set curation rules: concrete nouns (a few unambiguous abstract
  nouns are fine, e.g. RIDDLE, LUCK); no profanity; avoid ambiguous
  homographs (BEAR, BAT, and see v9 for PHOENIX/FAMILIAR/RAPTOR/STAR) since
  frequency conflates senses; adjacent Zipf gaps ideally >= ~0.25, but a
  tighter gap is an accepted difficulty lever, NOT a defect, as long as the
  number is real — ordinary polysemy that doesn't change the obvious
  meaning is fine too. Verify every set against wordfreq before shipping
  it; the corpus is the referee, even when it contradicts intuition.

  ── ROADMAP / OPEN THREADS ──────────────────────────────────────────────────
  * PUZZLES has 30 verified sets (see v9) — the list repeats starting
    2026-08-14 (puzzle #31). Add more sets (30 more buys another month)
    before then, working toward 365+ (generate candidates via the wordfreq
    pipeline, curate by hand, run the same homograph screen v9 used).
  * Puzzle numbering: currently puzzleNo = daysSinceEpoch+1 and the set is
    picked by dayNum % PUZZLES.length — fine while testing, but sets repeat.
    With a full year of sets, make index = dayNum directly.
  * Possible difficulty levers, in order of gentleness: MAX_GUESSES 4→5;
    themed days (SHOW_THEME); 6 words; "hard mode" (guesses must respect
    known constraints, à la Wordle).
  * Nice-to-haves: countdown handled (see NextPuzzleCountdown); global
    "% of players solved in N" needs a backend (Cloudflare Worker + KV is
    the cheap path) — deliberately out of scope for the static version.
  * The old dev panel (puzzle-list roaming for playtesting) is gone as of
    v8 — if you need to preview a future PUZZLES entry, temporarily edit
    EPOCH or add a throwaway entry at PUZZLES[dayNum % PUZZLES.length]
    locally; don't re-add a shipped in-app puzzle switcher.

  ── PERSISTENCE (localStorage; keys namespaced "wordrank.") ────────────────
  * wordrank.state — today's in-progress/finished game:
      { dayNum, order, guesses, status }  (restored on load if same day)
  * wordrank.stats —
      { played, wins, dist: {1..MAX_GUESSES}, losses, streak, maxStreak,
        lastCompletedDay, lastWinDay }
    Streak = consecutive calendar days with a win; a loss or a skipped day
    resets it. Stats update exactly once per day (guarded by
    lastCompletedDay !== dayNum).
  * wordrank.seenIntro — boolean, set true the first time the HowToPlay
    primer is dismissed. Only gates the AUTOMATIC first-visit popup; the
    "ⓘ" button always reopens the primer regardless of this flag.

  ── ANALYTICS (GA4 via gtag.js, measurement ID G-W95DLSXD3M) ───────────────
  GA4 already tracks unique users, sessions, and page_views automatically
  via its own client_id cookie/localStorage — that needed no code here. The
  game-specific layer is a thin `track(name, params)` wrapper (swallows
  errors so a blocked/missing gtag never breaks the game) firing these
  custom events (every play is a real one as of v8 — no more dev-panel
  test puzzles to exclude):
  * puzzle_view — { puzzle_no, day_num } once per page load.
  * howto_shown — { trigger: "auto" | "manual" } — auto on a genuine first
    visit (mirrors the wordrank.seenIntro gate), manual via the "ⓘ" button.
  * howto_dismissed — { first_time } from the primer's own dismiss button.
  * guess_submitted — { puzzle_no, guess_number, green_count, is_win } every
    submit.
  * game_complete — { puzzle_no, result: "win"|"loss", guesses_used,
    max_guesses } once per finished game.
  * share — GA4's recommended event name/shape: { method: "native" |
    "clipboard" | "clipboard_fallback", content_type, item_id, result,
    guesses_used }. Fired per SUCCESSFUL path, not per tap — a cancelled
    native share sheet falls through to the clipboard copy and gets
    attributed there instead, so this reflects what actually happened.
  * results_dismissed / results_reopened — { puzzle_no } for "← BACK TO
    PUZZLE" and the floating "VIEW RESULTS" pill (see v6 note).
  * feedback_link_clicked — { puzzle_no } from the footer's "PROBLEMS OR
    FEEDBACK?" link (opens CONFIG.FEEDBACK_URL, a Google Form, in a new tab).
  None of this is wired to GA4 custom dimensions/reports yet — that's a
  one-time setup in the GA4 admin UI (Admin → Custom definitions), not code;
  until then the params are still visible per-event in DebugView/Explore.

  ── VISUAL IDENTITY ("card catalog") ────────────────────────────────────────
  Lexicography aesthetic: archive gray-green paper (#E8EBE3), index-card
  tiles, IBM Plex Mono for all data/UI (typewriter/catalog-card voice),
  Fraunces only for the wordmark & endgame headline. Feedback pair doubles
  as the palette: leaf green / brass yellow, against the off-white card
  stock (white = not yet judged in this rank). The signature moment is the
  endgame "THE RECORD SHOWS" frequency reveal with per-million counts —
  the game showing its receipts.

/* ================= deterministic helpers ================= */
// Days since EPOCH in the player's local timezone. Everyone in one timezone
// gets the same puzzle; puzzles roll at local midnight (same as Wordle).
function daysSinceEpoch() {
  const ms = new Date(new Date().toDateString()) - new Date(CONFIG.EPOCH + "T00:00:00");
  return Math.max(0, Math.floor(ms / 86400000));
}
// Seeded Fisher-Yates so everyone sees the same scrambled starting board.
// Guards against dealing the solved order.
function seededShuffle(n, seed) {
  const arr = Array.from({ length: n }, (_, i) => i);
  let s = (seed * 9301 + 49297) % 233280;
  for (let i = n - 1; i > 0; i--) {
    s = (s * 9301 + 49297) % 233280;
    const j = Math.floor((s / 233280) * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  if (arr.every((v, i) => v === i)) arr.push(arr.shift());
  return arr;
}
const perMillion = (zipf) => {
  const v = Math.pow(10, zipf - 3);
  return v >= 100 ? Math.round(v) : v >= 10 ? Math.round(v * 10) / 10 : Math.round(v * 100) / 100;
};
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

/* ================= feedback: positional distance ================= */
// order[i] = word index; word index === true rank. Green = exact position;
// everything else (off by any amount) is yellow — see v4 note above for why
// red was dropped.
function scoreGuess(order) {
  return order.map((wordIdx, pos) => (wordIdx === pos ? "green" : "yellow"));
}
const EMOJI = { green: "\u{1F7E9}", yellow: "\u{1F7E8}" };

/* ================= persistence (localStorage) ================= */
const LS = {
  get(key, fallback) {
    try { const v = localStorage.getItem("wordrank." + key); return v ? JSON.parse(v) : fallback; }
    catch { return fallback; }
  },
  set(key, val) {
    try { localStorage.setItem("wordrank." + key, JSON.stringify(val)); } catch {}
  },
};

/* ================= analytics (GA4 via gtag.js, see <head>) =================
   Thin wrapper so a missing/blocked gtag (adblock, offline) never throws.
   GA4 already tracks unique users/sessions/page_views automatically via its
   own client_id cookie — no code needed for that. Everything below is the
   game-specific layer on top. See the "ANALYTICS EVENTS" note in the header
   comment for the full list of event names and params. */
function track(name, params) {
  try { if (typeof gtag === "function") gtag("event", name, params || {}); } catch {}
}
const EMPTY_STATS = () => ({
  played: 0, wins: 0, losses: 0,
  dist: Object.fromEntries(Array.from({ length: CONFIG.MAX_GUESSES }, (_, i) => [i + 1, 0])),
  streak: 0, maxStreak: 0, lastCompletedDay: null, lastWinDay: null,
});

/* ================= countdown to next puzzle ================= */
function NextPuzzleCountdown() {
  const calc = () => {
    const now = new Date();
    const midnight = new Date(now); midnight.setHours(24, 0, 0, 0);
    const s = Math.max(0, Math.floor((midnight - now) / 1000));
    const h = String(Math.floor(s / 3600)).padStart(2, "0");
    const m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
    return h + ":" + m;
  };
  const [t, setT] = useState(calc);
  useEffect(() => { const id = setInterval(() => setT(calc()), 30000); return () => clearInterval(id); }, []);
  return <span>NEXT PUZZLE IN {t}</span>;
}

/* ================= the game ================= */
function WordRank() {
  const dayNum = daysSinceEpoch();
  // Single daily puzzle, no in-app way to switch — see v8 note in the
  // header comment for why the old dev panel/test-puzzle switcher is gone.
  const puzzleIdx = dayNum % PUZZLES.length;   // TODO with 365+ sets: use dayNum directly

  const puzzle = PUZZLES[puzzleIdx];
  const n = puzzle.words.length;

  const initialOrder = useMemo(() => seededShuffle(n, (puzzleIdx + 1) * 7919), [puzzleIdx, n]);

  // Restore today's saved game (if any) on first render.
  const saved = useMemo(() => {
    const s = LS.get("state", null);
    return s && s.dayNum === dayNum ? s : null;
  }, [dayNum]);

  const [order, setOrder] = useState(saved ? saved.order : initialOrder);
  const [guesses, setGuesses] = useState(saved ? saved.guesses : []);
  const [status, setStatus] = useState(saved ? saved.status : "playing");
  const [selected, setSelected] = useState(null);
  const [toast, setToast] = useState("");
  const [stats, setStats] = useState(() => LS.get("stats", EMPTY_STATS()));

  // First-visit primer: shown once automatically, reopenable any time via
  // the "i" button (which does not touch the seenIntro flag).
  const [showIntro, setShowIntro] = useState(() => !LS.get("seenIntro", false));
  const closeIntro = () => {
    const firstTime = !LS.get("seenIntro", false);
    LS.set("seenIntro", true);
    setShowIntro(false);
    track("howto_dismissed", { first_time: firstTime });
  };

  // Fires once per page load: a real visit to today's puzzle, plus whether
  // the auto-shown primer greeted them (vs. a returning player who already
  // dismissed it on a prior visit).
  useEffect(() => {
    track("puzzle_view", { puzzle_no: dayNum + 1, day_num: dayNum });
    if (!LS.get("seenIntro", false)) track("howto_shown", { trigger: "auto" });
  }, []);

  // Results overlay: shown automatically whenever the puzzle is done (fresh
  // win/loss, or a completed game restored from localStorage). "BACK TO
  // PUZZLE" hides it so players can still see their finished board; a
  // floating pill brings it back (playtest feedback: results were pushed
  // to the bottom of the page and easy to miss/lose on a short phone).
  const [showResults, setShowResults] = useState(true);

  // Persist today's game on every change.
  useEffect(() => {
    LS.set("state", { dayNum, order, guesses, status });
  }, [order, guesses, status, dayNum]);

  /* ---------- drag state ---------- */
  const listRef = useRef(null);
  const rowHRef = useRef(62);
  const [drag, setDrag] = useState(null); // {from, startY, delta, moved}

  const done = status !== "playing";
  const lastGuess = guesses[guesses.length - 1];

  // A tile wears its verdict only while it still sits in the judged position.
  const tileVerdict = (pos) => {
    if (!lastGuess) return null;
    if (lastGuess.order[pos] !== order[pos]) return null;
    return lastGuess.colors[pos];
  };

  /* ---------- green locks (playtest v3.2) ----------
     Green = confirmed correct position, so green cards are PINNED: they
     can't be selected, dragged, or displaced by other cards moving past
     them. A tester moved a green card (the interaction allowed it), saw it
     lose its green, and reasonably concluded the game was broken. If the
     feedback is a fact, the board should enforce it. */
  const isLocked = (pos) => tileVerdict(pos) === "green";
  const unlockedPositions = order.map((_, p) => p).filter((p) => !isLocked(p));

  // Reorder ONLY the unlocked cards: dragged card leaves its slot, is
  // inserted at the target slot, other unlocked cards reflow through the
  // unlocked slots in order. Locked cards never move.
  const buildArrangement = (from, to) => {
    const words = unlockedPositions.map((p) => order[p]);
    const fromIdx = unlockedPositions.indexOf(from);
    const toIdx = unlockedPositions.indexOf(to);
    if (fromIdx < 0 || toIdx < 0) return order;
    const [item] = words.splice(fromIdx, 1);
    words.splice(toIdx, 0, item);
    const next = [...order];
    unlockedPositions.forEach((p, i) => { next[p] = words[i]; });
    return next;
  };

  // Map a raw pointer position to the nearest unlocked slot, preferring
  // the drag direction — so a card dragged "through" a pinned row lands
  // on the far side of it.
  const nearestUnlocked = (raw, dir) => {
    if (!isLocked(raw)) return raw;
    for (let step = 1; step < n; step++) {
      const fwd = raw + step * dir, back = raw - step * dir;
      if (fwd >= 0 && fwd < n && !isLocked(fwd)) return fwd;
      if (back >= 0 && back < n && !isLocked(back)) return back;
    }
    return raw;
  };

  const tapTile = (pos) => {
    if (done || isLocked(pos)) return;
    if (selected === null) { setSelected(pos); return; }
    if (selected === pos) { setSelected(null); return; }
    const next = [...order];
    [next[selected], next[pos]] = [next[pos], next[selected]];
    setOrder(next);
    setSelected(null);
  };

  const onPointerDown = (e, pos) => {
    if (done || isLocked(pos)) return;
    e.currentTarget.setPointerCapture(e.pointerId);
    const first = listRef.current && listRef.current.children[0];
    if (first) rowHRef.current = first.getBoundingClientRect().height + 8;
    setDrag({ from: pos, startY: e.clientY, delta: 0, moved: false });
  };
  const onPointerMove = (e) => {
    if (!drag) return;
    const delta = e.clientY - drag.startY;
    setDrag((d) => d && { ...d, delta, moved: d.moved || Math.abs(delta) > 6 });
  };

  // Live preview of the arrangement the current drag would produce;
  // committed on release, and used to compute each card's visual shift
  // (shifts can be multiple rows when reflowing past a pinned card).
  const hover = drag && drag.moved
    ? nearestUnlocked(
        clamp(drag.from + Math.round(drag.delta / rowHRef.current), 0, n - 1),
        drag.delta > 0 ? 1 : -1
      )
    : null;
  const preview = drag && drag.moved && hover !== null ? buildArrangement(drag.from, hover) : null;

  const onPointerUp = () => {
    if (!drag) return;
    if (!drag.moved) {
      tapTile(drag.from);
    } else if (preview) {
      setOrder(preview);
      setSelected(null);
    }
    setDrag(null);
  };

  const tileShift = (pos) => {
    if (!preview || pos === drag.from) return 0;
    const newPos = preview.indexOf(order[pos]);
    return (newPos - pos) * rowHRef.current;
  };

  // Guardrail (playtest): block resubmitting ANY previous arrangement,
  // not just the immediately preceding one — a confused player burned
  // their final guess re-trying their guess-1 order.
  const alreadyGuessed = guesses.some((g) => g.order.join(",") === order.join(","));

  // Stats update exactly once per real day (guarded by lastCompletedDay).
  const recordCompletion = (won, guessCount) => {
    setStats((prev) => {
      if (prev.lastCompletedDay === dayNum) return prev;
      const next = { ...prev, dist: { ...prev.dist } };
      next.played += 1;
      next.lastCompletedDay = dayNum;
      if (won) {
        next.wins += 1;
        next.dist[guessCount] = (next.dist[guessCount] || 0) + 1;
        next.streak = prev.lastWinDay === dayNum - 1 ? prev.streak + 1 : 1;
        next.maxStreak = Math.max(next.maxStreak, next.streak);
        next.lastWinDay = dayNum;
      } else {
        next.losses += 1;
        next.streak = 0;
      }
      LS.set("stats", next);
      return next;
    });
  };

  const submit = () => {
    if (done || alreadyGuessed) return;
    const colors = scoreGuess(order);
    const next = [...guesses, { order: [...order], colors }];
    setGuesses(next);
    const won = colors.every((c) => c === "green");
    track("guess_submitted", {
      puzzle_no: dayNum + 1,
      guess_number: next.length,
      green_count: colors.filter((c) => c === "green").length,
      is_win: won,
    });
    if (won) {
      setStatus("won"); recordCompletion(true, next.length);
      track("game_complete", { puzzle_no: dayNum + 1, result: "win", guesses_used: next.length, max_guesses: CONFIG.MAX_GUESSES });
    } else if (next.length >= CONFIG.MAX_GUESSES) {
      setStatus("lost"); recordCompletion(false);
      track("game_complete", { puzzle_no: dayNum + 1, result: "loss", guesses_used: next.length, max_guesses: CONFIG.MAX_GUESSES });
    }
  };

  const shareText = () => {
    const head = CONFIG.GAME_NAME + " #" + (dayNum + 1) + " — " + (status === "won" ? guesses.length : "X") + "/" + CONFIG.MAX_GUESSES;
    const grid = guesses.map((g) => g.colors.map((c) => EMOJI[c]).join("")).join("\n");
    // Tagline line + full https:// URL (not just a bare domain/path) so the
    // share reads on its own out of context and auto-links reliably in
    // apps that require a scheme to detect a URL (playtest feedback).
    return head + "\n" + CONFIG.SHARE_TAGLINE + "\n" + grid + "\n" + CONFIG.SHARE_URL;
  };
  const doShare = async () => {
    const text = shareText();
    // GA4's recommended "share" event — fired per successful path below so
    // method reflects what actually happened, not just what was attempted
    // (a cancelled native sheet falls through to clipboard, see below).
    const trackShare = (method) => {
      track("share", {
        method, content_type: "wordrank_result", item_id: "puzzle_" + (dayNum + 1),
        result: status, guesses_used: guesses.length,
      });
    };
    // Native share sheet on mobile; clipboard everywhere else.
    if (navigator.share) {
      try { await navigator.share({ text }); trackShare("native"); return; } catch (e) { /* user cancelled -> fall through */ }
    }
    try {
      await navigator.clipboard.writeText(text);
      setToast("Copied to clipboard");
      trackShare("clipboard");
    } catch {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand("copy"); ta.remove();
      setToast("Copied to clipboard");
      trackShare("clipboard_fallback");
    }
    setTimeout(() => setToast(""), 1800);
  };

  const guessesLeft = CONFIG.MAX_GUESSES - guesses.length;
  const maxZipf = Math.max(...puzzle.words.map((w) => w.zipf));
  const winPct = stats.played ? Math.round((stats.wins / stats.played) * 100) : 0;
  const maxDist = Math.max(1, ...Object.values(stats.dist));

  return (
    <>
      {/* reopens the HowToPlay primer any time; does not touch seenIntro */}
      <button
        onClick={() => { setShowIntro(true); track("howto_shown", { trigger: "manual" }); }}
        aria-label="How to play"
        style={{
          position: "fixed", top: 14, right: 14, zIndex: 50,
          width: 30, height: 30, borderRadius: "50%",
          background: C.card, border: "1.5px solid " + C.ink, color: C.ink,
          fontFamily: "'Fraunces', Georgia, serif", fontWeight: 800, fontSize: 15,
          display: "flex", alignItems: "center", justifyContent: "center",
          boxShadow: "2px 2px 0 rgba(32,41,31,0.15)",
        }}
      >
        i
      </button>
      {showIntro && <HowToPlay onClose={closeIntro} maxGuesses={CONFIG.MAX_GUESSES} />}

      <div style={{ minHeight: "100vh", background: C.paper, color: C.ink, fontFamily: "'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace", display: "flex", justifyContent: "center", padding: "0 12px 48px" }}>
      <div style={{ width: "100%", maxWidth: 420 }}>

        {/* header — kept compact on purpose: header + key + 5 tiles + submit
            must all fit above the fold on a small phone (see v6 note) */}
        <header style={{ textAlign: "center", padding: "12px 0 6px", borderBottom: "2px solid " + C.ink }}>
          <div style={{ fontFamily: "'Fraunces', Georgia, serif", fontWeight: 800, fontSize: 28, letterSpacing: "-0.5px", lineHeight: 1 }}>
            {CONFIG.GAME_NAME}
          </div>
          <div style={{ display: "flex", justifyContent: "center", gap: 14, marginTop: 4, fontSize: 10.5, color: C.faint, letterSpacing: "1.5px" }}>
            <span>No. {dayNum + 1}</span>
            <span>·</span>
            <span>{CONFIG.SHOW_THEME ? puzzle.theme.toUpperCase() : "RANK BY HOW COMMON"}</span>
          </div>
          {/* one-line "about" for anyone who lands here cold (e.g. from a
              social link) and hasn't opened the HowToPlay primer yet */}
          <div style={{ marginTop: 6, fontSize: 11.5, color: C.ink, opacity: 0.75 }}>
            Sort 5 words most → least common. ~1 min, {CONFIG.MAX_GUESSES} tries.
          </div>
        </header>

        {/* color key — pinned at TOP, not the bottom: on a short phone the
            bottom of the page can scroll out of view mid-game, and players
            need this while looking at the board, not after scrolling past
            it (real feedback — see v6 note in the header comment). */}
        <div style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", gap: "3px 12px", margin: "8px 0 2px", fontSize: 10.5, color: C.faint }}>
          <span><span style={{ ...swatch, background: C.green }} />exact</span>
          <span><span style={{ ...swatch, background: C.yellow }} />wrong spot</span>
          <span><span style={{ ...swatch, background: C.card, border: "1.5px solid " + C.line }} />unguessed</span>
        </div>

        {/* board */}
        <div style={{ marginTop: 6 }}>
          <RailLabel text="MOST COMMON" />
          <div ref={listRef} style={{ display: "flex", flexDirection: "column", gap: 6, margin: "5px 0" }}>
            {order.map((wordIdx, pos) => {
              const isSel = selected === pos;
              const verdict = tileVerdict(pos);
              const locked = isLocked(pos);
              const isDragged = drag && drag.moved && drag.from === pos;
              const v = verdict ? VERDICT[verdict] : null;
              const bg = v ? v.bg : C.card;
              const fg = verdict ? "#F4F5F0" : C.ink;
              const numFg = verdict ? "rgba(244,245,240,.6)" : C.faint;
              const border = v ? v.border : isSel ? C.ink : C.line;
              return (
                <button
                  key={puzzle.words[wordIdx].w}
                  onPointerDown={(e) => onPointerDown(e, pos)}
                  onPointerMove={onPointerMove}
                  onPointerUp={onPointerUp}
                  onPointerCancel={() => setDrag(null)}
                  disabled={done}
                  style={{
                    display: "flex", alignItems: "center", gap: 12,
                    background: bg, color: fg,
                    border: "2px solid " + border,
                    boxShadow: isDragged ? "4px 6px 0 rgba(32,41,31,0.3)" : isSel ? "3px 3px 0 " + C.ink : "2px 2px 0 rgba(32,41,31,0.12)",
                    transform: isDragged
                      ? "translateY(" + drag.delta + "px) scale(1.02)"
                      : "translateY(" + tileShift(pos) + "px)" + (isSel ? " translate(-2px,-2px)" : ""),
                    transition: isDragged ? "none" : "transform .15s, background .2s, border-color .2s, box-shadow .12s",
                    zIndex: isDragged ? 10 : 1,
                    position: "relative",
                    touchAction: "none",
                    userSelect: "none", WebkitUserSelect: "none",
                    padding: "11px 14px", borderRadius: 3,
                    fontFamily: "inherit", fontSize: 16, fontWeight: 600,
                    letterSpacing: "1.5px", textAlign: "left",
                    cursor: locked ? "default" : "pointer",
                    opacity: done && !verdict ? 0.95 : 1,
                  }}
                >
                  <span style={{ fontSize: 11, color: numFg, minWidth: 14 }}>{pos + 1}</span>
                  <span style={{ flex: 1 }}>{puzzle.words[wordIdx].w}</span>
                  {!done && (
                    <span style={{ fontSize: locked ? 10 : 12, letterSpacing: locked ? "1px" : "normal", color: isSel ? C.ink : verdict ? "rgba(244,245,240,.75)" : C.line }}>
                      {locked ? "✓" : isSel ? "TAP ANOTHER TO SWAP" : "⠿"}
                    </span>
                  )}
                </button>
              );
            })}
          </div>
          <RailLabel text="LEAST COMMON" />
        </div>

        {/* submit */}
        {!done && (
          <button
            onClick={submit}
            disabled={alreadyGuessed}
            style={{
              width: "100%", marginTop: 10, padding: "12px 0",
              background: alreadyGuessed ? C.line : C.ink, color: C.paper,
              border: "none", borderRadius: 3, fontFamily: "inherit",
              fontWeight: 600, fontSize: 14, letterSpacing: "2px",
            }}
          >
            {alreadyGuessed ? "ALREADY TRIED THIS ORDER" : "SUBMIT — " + guessesLeft + (guessesLeft === 1 ? " TRY" : " TRIES") + " LEFT"}
          </button>
        )}

        {/* guess record — shows arrangements, not just colors, to enable deduction */}
        {guesses.length > 0 && (
          <div style={{ marginTop: 14 }}>
            <div style={{ fontSize: 10, letterSpacing: "2px", color: C.faint, marginBottom: 6 }}>RECORD</div>
            {guesses.map((g, gi) => (
              <div key={gi} style={{ display: "flex", alignItems: "center", gap: 5, marginBottom: 4 }}>
                <span style={{ fontSize: 10, color: C.faint, width: 12 }}>{gi + 1}</span>
                {g.colors.map((c, i) => (
                  <div key={i} style={{
                    flex: 1, height: 24, background: VERDICT[c].bg, borderRadius: 2,
                    display: "flex", alignItems: "center", justifyContent: "center",
                    color: "rgba(248,248,242,.92)", fontSize: 9, fontWeight: 600,
                    letterSpacing: "0.5px", overflow: "hidden", whiteSpace: "nowrap",
                    animation: "pop .18s ease-out",
                  }}>
                    {puzzle.words[g.order[i]].w.length > 7
                      ? puzzle.words[g.order[i]].w.slice(0, 6) + "…"
                      : puzzle.words[g.order[i]].w}
                  </div>
                ))}
              </div>
            ))}
          </div>
        )}

        <footer style={{ textAlign: "center", fontSize: 9, color: C.faint, letterSpacing: "1px", marginTop: 20 }}>
          <div>FREQUENCY DATA: VERIFIED VIA WORDFREQ (ENGLISH CORPUS)</div>
          <a
            href={CONFIG.FEEDBACK_URL}
            target="_blank"
            rel="noopener noreferrer"
            onClick={() => track("feedback_link_clicked", { puzzle_no: dayNum + 1 })}
            style={{ display: "inline-block", marginTop: 10, color: C.faint, letterSpacing: "1.5px", textDecoration: "underline" }}
          >
            PROBLEMS OR FEEDBACK?
          </a>
        </footer>
      </div>
      </div>

      {/* endgame: reveal + share + stats, as an overlay (not stacked inline
          below the board) so it's never just "at the bottom" past a scroll —
          see v6 note. "BACK TO PUZZLE" hides it; the pill below reopens it. */}
      {done && showResults && (
        <ResultsOverlay
          onClose={() => { setShowResults(false); track("results_dismissed", { puzzle_no: dayNum + 1 }); }}
          won={status === "won"}
          guessCount={guesses.length}
          words={puzzle.words}
          maxZipf={maxZipf}
          stats={stats}
          winPct={winPct}
          maxDist={maxDist}
          doShare={doShare}
          toast={toast}
        />
      )}
      {done && !showResults && (
        <button
          onClick={() => { setShowResults(true); track("results_reopened", { puzzle_no: dayNum + 1 }); }}
          style={{
            position: "fixed", bottom: 18, left: "50%", transform: "translateX(-50%)",
            zIndex: 60, background: C.ink, color: C.paper, border: "none", borderRadius: 20,
            padding: "11px 20px", fontFamily: "'IBM Plex Mono', ui-monospace, monospace",
            fontWeight: 600, fontSize: 12, letterSpacing: "1.5px",
            boxShadow: "2px 3px 0 rgba(0,0,0,0.25)",
          }}
        >
          {status === "won" ? "VIEW RESULTS" : "VIEW ANSWER"}
        </button>
      )}
    </>
  );
}

function RailLabel({ text }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
      <div style={{ flex: 1, height: 1, background: C.line }} />
      <span style={{ fontSize: 9.5, letterSpacing: "2.5px", color: C.faint }}>{text}</span>
      <div style={{ flex: 1, height: 1, background: C.line }} />
    </div>
  );
}
function Stat({ n, label }) {
  return (
    <div style={{ textAlign: "center" }}>
      <div style={{ fontFamily: "'Fraunces', Georgia, serif", fontWeight: 800, fontSize: 22 }}>{n}</div>
      <div style={{ fontSize: 9, letterSpacing: "1.5px", color: C.faint }}>{label}</div>
    </div>
  );
}

/* ================= HowToPlay: one-screen primer ================= */
// Shown full-bleed on first visit (gated by wordrank.seenIntro); reopenable
// any time via the "i" button. Owns ALL onboarding content — the permanent
// footer under the board only repeats the color key, not the rules.
const swatch = {
  display: "inline-block", width: 11, height: 11, borderRadius: 2,
  marginRight: 7, verticalAlign: "middle", flexShrink: 0,
};
function HowStep({ n, children }) {
  return (
    <div style={{ display: "flex", gap: 10, marginBottom: 12, fontSize: 13, lineHeight: 1.5 }}>
      <span style={{
        flexShrink: 0, width: 20, height: 20, borderRadius: "50%",
        background: C.ink, color: C.paper, fontSize: 11, fontWeight: 700,
        display: "flex", alignItems: "center", justifyContent: "center",
      }}>{n}</span>
      <span>{children}</span>
    </div>
  );
}
function HowToPlay({ onClose, maxGuesses }) {
  return (
    <div style={{
      position: "fixed", inset: 0, zIndex: 100, background: "rgba(32,41,31,0.92)",
      display: "flex", alignItems: "center", justifyContent: "center", padding: 20,
    }}>
      <div style={{
        width: "100%", maxWidth: 380, maxHeight: "90vh", overflowY: "auto",
        background: C.card, color: C.ink, border: "2px solid " + C.ink, borderRadius: 4,
        padding: "26px 22px", boxShadow: "4px 4px 0 rgba(0,0,0,0.3)",
        fontFamily: "'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace",
      }}>
        <div style={{ fontFamily: "'Fraunces', Georgia, serif", fontWeight: 800, fontSize: 26, textAlign: "center" }}>
          HOW TO PLAY
        </div>
        <div style={{ fontSize: 11, letterSpacing: "1.5px", color: C.faint, textAlign: "center", marginBottom: 20 }}>
          A NEW PUZZLE EVERY DAY — ABOUT A MINUTE TO PLAY
        </div>

        <HowStep n="1">Rank 5 words from <b>most</b> to <b>least</b> commonly used in everyday English.</HowStep>
        <HowStep n="2">Drag a card to reorder it, or tap two cards to swap them.</HowStep>
        <HowStep n="3">Submit your order — each card is scored by how close it lands to its true rank.</HowStep>
        <HowStep n="4">You get {maxGuesses} tries. All green means solved.</HowStep>

        <div style={{ marginTop: 16, paddingTop: 16, borderTop: "1px solid " + C.line, fontSize: 12.5, lineHeight: 2 }}>
          <div><span style={{ ...swatch, background: C.green }} /><b>green</b> — right spot, locks in place</div>
          <div><span style={{ ...swatch, background: C.yellow }} /><b>yellow</b> — wrong spot</div>
          <div><span style={{ ...swatch, background: C.card, border: "1.5px solid " + C.line }} /><b>white</b> — not guessed in this rank yet</div>
        </div>

        <button onClick={onClose} style={{
          width: "100%", marginTop: 22, padding: "14px 0",
          background: C.ink, color: C.paper, border: "none", borderRadius: 3,
          fontFamily: "inherit", fontWeight: 600, fontSize: 14, letterSpacing: "2px",
        }}>
          GOT IT — LET'S PLAY
        </button>
      </div>
    </div>
  );
}

/* ================= ResultsOverlay: endgame as a full-screen overlay =====
   Order is deliberate (playtest feedback): headline, then SHARE (the thing
   players actually came here to do), then stats — NOT the frequency reveal
   first. "THE RECORD SHOWS" reveal is last: satisfying but least urgent.
   "BACK TO PUZZLE" lets players see their finished (all-green/locked) board
   underneath; WordRank renders a floating "VIEW RESULTS" pill to reopen. */
function ResultsOverlay({ onClose, won, guessCount, words, maxZipf, stats, winPct, maxDist, doShare, toast }) {
  return (
    <div style={{
      position: "fixed", inset: 0, zIndex: 90, background: "rgba(32,41,31,0.92)",
      display: "flex", alignItems: "center", justifyContent: "center", padding: 16,
    }}>
      <div style={{
        width: "100%", maxWidth: 380, maxHeight: "90vh", overflowY: "auto",
        background: C.card, color: C.ink, border: "2px solid " + C.ink, borderRadius: 4,
        padding: "16px 18px 20px", boxShadow: "4px 4px 0 rgba(0,0,0,0.3)",
        fontFamily: "'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace",
      }}>
        <button onClick={onClose} style={{
          background: "none", border: "none", color: C.faint, fontFamily: "inherit",
          fontSize: 11, letterSpacing: "1px", padding: 0, marginBottom: 14,
        }}>
          ← BACK TO PUZZLE
        </button>

        <div style={{ fontFamily: "'Fraunces', Georgia, serif", fontWeight: 800, fontSize: 24, textAlign: "center" }}>
          {won ? "Solved in " + guessCount : "Out of tries"}
        </div>

        <button onClick={doShare} style={{ width: "100%", marginTop: 14, padding: "13px 0", background: C.green, color: "#fff", border: "none", borderRadius: 3, fontFamily: "inherit", fontWeight: 600, fontSize: 14, letterSpacing: "2px" }}>
          SHARE RESULT
        </button>
        {toast && <div style={{ textAlign: "center", fontSize: 11.5, color: C.faint, marginTop: 8 }}>{toast}</div>}

        {/* stats (localStorage) */}
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 18, paddingTop: 14, borderTop: "1px solid " + C.line }}>
          <Stat n={stats.played} label="PLAYED" />
          <Stat n={winPct + "%"} label="WIN" />
          <Stat n={stats.streak} label="STREAK" />
          <Stat n={stats.maxStreak} label="BEST" />
        </div>
        <div style={{ marginTop: 12 }}>
          {Object.entries(stats.dist).map(([k, v]) => (
            <div key={k} style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 3 }}>
              <span style={{ fontSize: 10, color: C.faint, width: 10 }}>{k}</span>
              <div style={{ flex: 1, height: 12, background: C.paper, borderRadius: 2 }}>
                <div style={{ height: "100%", borderRadius: 2, background: v ? C.green : "transparent", width: Math.max(v ? 8 : 0, (v / maxDist) * 100) + "%" }} />
              </div>
              <span style={{ fontSize: 10, color: C.faint, width: 16, textAlign: "right" }}>{v}</span>
            </div>
          ))}
        </div>

        {/* frequency reveal — the receipts, last because it's a bonus, not the goal */}
        <div style={{ marginTop: 18, paddingTop: 14, borderTop: "1px solid " + C.line }}>
          <div style={{ fontSize: 11, color: C.faint, letterSpacing: "1px", marginBottom: 12 }}>
            THE RECORD SHOWS — uses per million words
          </div>
          {words.map((w, i) => (
            <div key={w.w} style={{ marginBottom: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, fontWeight: 600, letterSpacing: "1px" }}>
                <span>{i + 1}. {w.w}</span>
                <span style={{ color: C.faint }}>{perMillion(w.zipf)}/M</span>
              </div>
              <div style={{ height: 8, background: C.paper, borderRadius: 2, marginTop: 3 }}>
                <div style={{
                  height: "100%", borderRadius: 2, background: C.ink,
                  width: Math.max(4, Math.pow(10, w.zipf - maxZipf) * 100) + "%",
                  animation: "grow .5s ease-out",
                }} />
              </div>
            </div>
          ))}
        </div>

        <div style={{ textAlign: "center", fontSize: 10, letterSpacing: "2px", color: C.faint, marginTop: 16 }}>
          <NextPuzzleCountdown />
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<WordRank />);
</script>
</body>
</html>
