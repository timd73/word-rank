<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WordRank has moved to Commoner</title>
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://timd73.github.io/commoner/" />
<meta http-equiv="refresh" content="5;url=https://timd73.github.io/commoner/" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128218;</text></svg>" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  html, body { margin: 0; padding: 0; background: #E8EBE3; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    color: #20291F;
  }
  .card {
    max-width: 420px; width: calc(100% - 48px); text-align: center;
    background: #F8F8F2; border: 2px solid #20291F; border-radius: 3px;
    padding: 32px 24px; box-shadow: 3px 3px 0 rgba(32,41,31,0.2);
  }
  .wordmark { font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-size: 32px; letter-spacing: -0.5px; }
  .arrow { color: #6B7568; font-size: 20px; margin: 10px 0; }
  .newname { font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-size: 32px; color: #3E8E5A; }
  p { color: #6B7568; font-size: 13px; line-height: 1.7; margin: 18px 0 0; }
  a.go { display: inline-block; margin-top: 18px; padding: 12px 20px; background: #20291F; color: #E8EBE3;
    text-decoration: none; border-radius: 3px; font-weight: 600; font-size: 13px; letter-spacing: 1.5px; }
  #count { font-weight: 600; color: #20291F; }
</style>
</head>
<body>
  <div class="card">
    <div class="wordmark">WordRank</div>
    <div class="arrow">&#8595;</div>
    <div class="newname">Commoner</div>
    <p>This game has moved and been renamed.<br />
       Redirecting in <span id="count">5</span> seconds&hellip;</p>
    <a class="go" href="https://timd73.github.io/commoner/">GO TO COMMONER NOW</a>
  </div>
  <script>
    var n = 5;
    var el = document.getElementById("count");
    var id = setInterval(function () {
      n -= 1;
      if (n <= 0) { clearInterval(id); window.location.replace("https://timd73.github.io/commoner/"); }
      else { el.textContent = n; }
    }, 1000);
  </script>
</body>
</html>
